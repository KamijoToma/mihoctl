[package]
name = "mihoctl"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
rquickjs = "0.14"
semver = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_yaml_ng = "0.10.0"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
toml = "1.2.1"
ureq = { version = "3", features = ["json"] }

# rquickjs-sys ships pre-generated bindings for Linux, macOS and Windows only; elsewhere they are
# generated at build time, which needs libclang (FreeBSD: `pkg install llvm`).
[target.'cfg(not(any(target_os = "linux", target_os = "macos", target_os = "windows")))'.dependencies]
rquickjs = { version = "0.14", features = ["bindgen"] }
