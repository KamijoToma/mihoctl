name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify Clippy & Tests
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # `mihoctl self-update` compares the release tag with the version the binary reports, so a tag
      # that disagrees with Cargo.toml would make every install look like another pending update.
      - name: Check the tag matches the crate version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --locked --format-version 1 | jq -r '.packages[0].version')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the Cargo.toml version ${version}"
            exit 1
          fi

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

  build:
    name: Build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          # musl: static binaries that run on any distribution
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install musl toolchain
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package binary archive
        run: sh .github/scripts/package.sh "${GITHUB_REF_NAME}" "${{ matrix.target }}" "target/${{ matrix.target }}/release/mihoctl"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # The Linux and macOS builds cross-target from GitHub runners; FreeBSD has none, so it builds
  # inside a VM (the same recipe as the `freebsd` job in ci.yml).
  build-freebsd:
    name: Build (x86_64-unknown-freebsd)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build and package in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        env:
          TAG: ${{ github.ref_name }}
        with:
          # Binaries built on a FreeBSD release run on that release and newer ones.
          release: "14"
          envs: TAG
          usesh: true
          prepare: pkg install -y rust llvm
          run: |
            set -e
            export LIBCLANG_PATH="$(ls -d /usr/local/llvm*/lib | sort -V | tail -1)"
            # Outside the workspace, so the sync back to the runner carries only dist/.
            export CARGO_TARGET_DIR=/tmp/mihoctl-target
            cargo build --release --locked
            sh .github/scripts/package.sh "$TAG" x86_64-unknown-freebsd "$CARGO_TARGET_DIR/release/mihoctl"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-x86_64-unknown-freebsd
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build, build-freebsd]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Package source archives & generate checksums
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p release-assets
          git archive --format=tar.gz --prefix="mihoctl-${TAG}-src/" -o "release-assets/mihoctl-${TAG}-src.tar.gz" HEAD
          git archive --format=zip --prefix="mihoctl-${TAG}-src/" -o "release-assets/mihoctl-${TAG}-src.zip" HEAD
          cd release-assets
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: mihoctl ${{ github.ref_name }}
          generate_release_notes: true
          # v1.2.3-rc.1 is a prerelease, which GitHub's "latest release" (what self-update installs) skips.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/SHA256SUMS.txt
